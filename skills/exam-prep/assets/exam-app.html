<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock exam</title>
<style>
:root {
  --bg: #f6f6f3; --paper: #ffffff; --ink: #1d1f22; --muted: #5d6268; --line: #dcdcd6;
  --accent: #2357c6; --accent-ink: #ffffff; --soft: #eaf0fb;
  --good: #1d7a46; --good-soft: #e3f3e9; --bad: #b3261e; --bad-soft: #fbe7e5; --warn: #8a5a00; --warn-soft: #fdf1d8;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121315; --paper: #1b1d20; --ink: #e8e8e6; --muted: #a2a6ab; --line: #33363b;
    --accent: #7aa2ff; --accent-ink: #0d1117; --soft: #1f2a40;
    --good: #5cc48a; --good-soft: #15281d; --bad: #ff8a80; --bad-soft: #301816; --warn: #e8b85a; --warn-soft: #2d2412;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121315; --paper: #1b1d20; --ink: #e8e8e6; --muted: #a2a6ab; --line: #33363b;
  --accent: #7aa2ff; --accent-ink: #0d1117; --soft: #1f2a40;
  --good: #5cc48a; --good-soft: #15281d; --bad: #ff8a80; --bad-soft: #301816; --warn: #e8b85a; --warn-soft: #2d2412;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "PingFang TC", "Microsoft JhengHei", "Microsoft YaHei", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.top { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-in { max-width: 980px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { font-weight: 650; margin-right: auto; cursor: pointer; }
.top select, .top button { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 64px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card h2 { margin: 0 0 6px; font-size: 1.15rem; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.plain { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.badge { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: .82rem; font-weight: 650; }
.badge.pass { background: var(--good-soft); color: var(--good); }
.badge.fail { background: var(--bad-soft); color: var(--bad); }
.badge.note { background: var(--warn-soft); color: var(--warn); }
.alt { display: block; color: var(--muted); font-size: .94em; margin-top: 2px; }
.pri { display: inline; }
.src .alt { display: inline; margin: 0; }
.src .alt::before { content: " / "; }
.modal h2 { font-size: 1.1rem; margin: 0 0 8px; }
.q-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
.case { border-left: 3px solid var(--accent); background: var(--soft); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 0 0 14px; }
.stem { font-size: 1.06rem; margin: 0 0 12px; }
.hint { color: var(--muted); font-size: .88rem; margin: -4px 0 10px; }
.statements { margin: 0 0 14px; padding: 0; list-style: none; counter-reset: st; }
.statements li { padding: 8px 10px 8px 40px; position: relative; border-radius: 8px; }
.statements li::before { content: attr(data-n) "."; position: absolute; left: 12px; top: 8px; font-weight: 650; color: var(--muted); }
.statements li.t { background: var(--good-soft); }
.statements li.f { background: var(--bad-soft); }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 9px; padding: 10px 12px; cursor: pointer; align-items: flex-start; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .L { flex: none; width: 1.7em; height: 1.7em; border-radius: 50%; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-weight: 650; font-size: .88rem; }
.opt.sel { border-color: var(--accent); background: var(--soft); }
.opt.sel .L { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.key { border-color: var(--good); background: var(--good-soft); }
.opt.miss { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; color: inherit; }
.why { display: block; color: var(--muted); font-size: .9rem; margin-top: 4px; }
.verdict { border-radius: 8px; padding: 10px 14px; margin: 14px 0 6px; font-weight: 600; }
.verdict.good { background: var(--good-soft); color: var(--good); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict.part { background: var(--warn-soft); color: var(--warn); }
.explain { margin-top: 10px; }
.src { margin-top: 10px; color: var(--muted); font-size: .9rem; }
.match-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
@media (max-width: 560px) { .match-row { grid-template-columns: 1fr; } }
.match-row select { width: 100%; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); }
.order-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.order-list li { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--paper); }
.order-list li .grow { flex: 1; }
.order-list button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.cloze input, .cloze select, .num { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; min-width: 6em; background: var(--paper); }
textarea { width: 100%; min-height: 8em; border: 1px solid var(--line); border-radius: 9px; padding: 10px; background: var(--paper); }
.essay textarea { min-height: 16em; }
.model { background: var(--soft); border-radius: 8px; padding: 10px 14px; margin: 8px 0; }
.rubric label { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; }
.exam-wrap { display: grid; grid-template-columns: 1fr 230px; gap: 16px; align-items: start; }
@media (max-width: 860px) { .exam-wrap { grid-template-columns: 1fr; } .sheet { order: -1; } }
.sheet { position: sticky; top: 64px; }
.sheet h3 { font-size: .85rem; margin: 10px 0 6px; color: var(--muted); font-weight: 600; }
.sheet .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 5px; }
.cell { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; height: 32px; cursor: pointer; font-size: .82rem; position: relative; }
.cell.ans { background: var(--soft); border-color: var(--accent); }
.cell.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.timer { font-variant-numeric: tabular-nums; font-weight: 650; }
.timer.low { color: var(--bad); }
.bar { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; margin-top: 16px; }
table.t { width: 100%; border-collapse: collapse; font-size: .94rem; }
table.t th, table.t td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.big { font-size: 2rem; font-weight: 700; margin: 4px 0; }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.modal { background: var(--paper); border-radius: 12px; padding: 20px; max-width: 440px; width: 100%; border: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 30; max-width: 90vw; }
.foot { margin-top: 28px; color: var(--muted); font-size: .85rem; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: .8em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media print { .top, .sheet, .bar { display: none; } }
</style>
</head>

        return `<strong>${esc(cur || '—')}</strong> <span class="badge ${ok ? 'pass' : 'fail'}">${esc(acc.join(' / '))}</span>`;
      }
      if (choices && choices[b]) return `<select data-act="cloze" data-b="${b}"><option value=""></option>${choices[b].map(c => `<option ${c === cur ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>`;
      return `<input data-act="cloze" data-b="${b}" value="${esc(cur)}" autocomplete="off" size="10">`;

}
function respLabel(it, inst, r) {

}

// ------------------------------------------------------------ responses (shared by exam and practice)
function applyAction(it, inst, r, el) {
  const act = el.dataset.act;
  if (act === 'pick') {
    const i = +el.dataset.i;
    if (it.kind === 'multi') { const s = new Set(r || []); s.has(i) ? s.delete(i) : s.add(i); return [...s].sort((a, b) => a - b); }
    return r === i ? null : i;
  }
  if (act === 'tf') { const v = el.dataset.v === '1'; return r === v ? null : v; }
  if (act === 'match') { const f = it[LANGS[0]]; const a = r ? r.slice() : (f.left || []).map(() => null); a[+el.dataset.i] = el.value === '' ? null : +el.value; return a; }
  if (act === 'up' || act === 'down') { const a = (r || inst.perm).slice(); const p = +el.dataset.p, q = act === 'up' ? p - 1 : p + 1; if (q < 0 || q >= a.length) return a; [a[p], a[q]] = [a[q], a[p]]; return a; }
  if (act === 'cloze') { const n = ((it[LANGS[0]] || {}).answers || []).length; const a = r ? r.slice() : Array(n).fill(''); a[+el.dataset.b] = el.value; return a; }
  if (act === 'num') return el.value;
  if (act === 'write') return Object.assign({}, r || {}, { text: el.value });
  if (act === 'tick') {
    const f = it[uiLang()] || it[LANGS[0]];
    const ticks = ((r && r.ticks) || []).slice(); ticks[+el.dataset.r] = el.checked;
    const marks = (f.rubric || []).reduce((a, p, i) => a + (ticks[i] ? +p.marks : 0), 0);
    return Object.assign({}, r || {}, { ticks, marks });
  }
  if (act === 'level') { const f = it[uiLang()] || it[LANGS[0]]; const i = +el.dataset.r; return Object.assign({}, r || {}, { level: i, marks: +f.levels[i].marks }); }
  return r;
}
function keyChoice(e, it, inst) {
  // A–H or 1–9 picks the option at that display position
  const k = e.key.toUpperCase();
  let pos = LETTERS.indexOf(k);
  if (pos < 0 && /^[1-9]$/.test(k)) pos = +k - 1;
  if (pos < 0) return null;
  if (it.kind === 'single' || it.kind === 'multi') return inst.perm[pos] == null ? null : { act: 'pick', i: inst.perm[pos] };
  if (it.kind === 'combo') { const o = comboShown(it, inst)[pos]; return o ? { act: 'pick', i: o.stored } : null; }
  if (it.kind === 'tf' && pos < 2) return { act: 'tf', v: pos === 0 ? '1' : '0' };

}

function evaluate(rows) {
  const per = {};
  SECTIONS.forEach(s => { per[s.id] = { earned: 0, max: 0, wrong: 0, n: 0 }; });
  let earned = 0, max = 0;
  rows.forEach(r => {
    const p = per[r.section] || (per[r.section] = { earned: 0, max: 0, wrong: 0, n: 0 });
    p.earned += r.earned; p.max += r.max; p.n += 1; if (!r.full) p.wrong += 1;
    earned += r.earned; max += r.max;
  });
  const rule = (SPEC.paper || {}).pass || {};
  const reasons = [];
  if (rule.min_score != null && earned < rule.min_score) reasons.push({ k: 'rScore', a: [rule.min_score] });
  if (rule.min_percent != null && max && 100 * earned / max < rule.min_percent) reasons.push({ k: 'rPercent', a: [rule.min_percent] });
  Object.keys(per).forEach(sid => {
    const p = per[sid];
    if (!p.n) return;
    if (rule.min_per_section != null && p.earned < rule.min_per_section) reasons.push({ k: 'rSection', a: [sid, rule.min_per_section] });
    if (rule.max_wrong_per_section != null && p.wrong > rule.max_wrong_per_section) reasons.push({ k: 'rWrong', a: [sid, rule.max_wrong_per_section] });
  });
  const hasRule = ['min_score', 'min_percent', 'min_per_section', 'max_wrong_per_section'].some(k => rule[k] != null);
  return { per, earned, max, reasons, pass: hasRule ? reasons.length === 0 : null };
}

      if (!d || d.exam !== (SPEC.id || 'default') || !Array.isArray(d.history)) throw new Error('bad');
      const hist = getHistory(), have = new Set(hist.map(a => a.uid));
      const add = d.history.filter(a => a && a.uid && !have.has(a.uid));
      store.set('history', hist.concat(add).sort((x, y) => x.ts - y.ts));
      const w = getWrong(); Object.entries(d.wrong || {}).forEach(([id, e]) => { if (!w[id] && ITEMS.has(id)) w[id] = e; }); store.set('wrong', w);
      const s = getSeen(); Object.entries(d.seen || {}).forEach(([id, n]) => { s[id] = Math.max(s[id] || 0, n); }); store.set('seen', s);
      toast(t('imported', add.length)); render();
    } catch (e) { toast(t('badFile')); }
  };
  reader.readAsText(file);
}

// ------------------------------------------------------------ events
function setResp(el) {
  if (view === 'exam') {
    const [it, x] = curExamItem();
    x.resp = applyAction(it, x.inst, x.resp, el);
    saveExam();
  } else if (view === 'practice' && practice && practice.inst) {
    const it = ITEMS.get(practice.queue[practice.pos]);
    practice.resp = applyAction(it, practice.inst, practice.resp, el);
  } else if (view === 'mark') {
    const card = el.closest('[data-q]');
    const x = exam.items[+card.dataset.q];
    x.resp = applyAction(ITEMS.get(x.id), x.inst, x.resp, el);
    saveExam();
    return;
  }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (['pick', 'tf', 'up', 'down'].includes(act)) { setResp(el); render(); return; }
  if (['tick', 'level'].includes(act)) {
    if (view === 'practice') { const it = ITEMS.get(practice.queue[practice.pos]); practice.resp = applyAction(it, practice.inst, practice.resp, el); }
    else setResp(el);
    return;
  }
  switch (act) {
    case 'home': go('home'); break;
    case 'mock': startMock(); break;
    case 'resume': exam = loadExam(); if (exam) { if (exam.finishedAt) { go('mark'); } else go('exam'); } else render(); break;
    case 'discard': modal(t('discard'), '', t('discard'), () => { store.del('current'); render(); }, true); break;
    case 'prev': exam.pos = Math.max(0, exam.pos - 1); saveExam(); render(); break;
    case 'next': exam.pos = Math.min(exam.items.length - 1, exam.pos + 1); saveExam(); render(); break;
    case 'jump': exam.pos = +el.dataset.q; saveExam(); render(); break;
    case 'flag': curExamItem()[1].flag = !curExamItem()[1].flag; saveExam(); render(); break;
    case 'submit': confirmSubmit(); break;
    case 'finishmark': finalize(); break;
    case 'open': viewing = getHistory().find(a => a.uid === el.dataset.u); if (viewing) go('results'); break;
    case 'practisewrong': startPractice(viewing.items.filter(r => !r.full && ITEMS.has(r.id)).map(r => r.id)); break;
    case 'secall': pracSel = pracSel.size === SECTIONS.length ? new Set() : new Set(SECTIONS.map(s => s.id)); render(); break;
    case 'sec': { const s = el.dataset.s; pracSel.has(s) ? pracSel.delete(s) : pracSel.add(s); render(); break; }
    case 'practice': startPractice(practicePool()); break;
    case 'wrongbook': startPractice(shuffle(Object.keys(getWrong()).filter(id => ITEMS.has(id)))); break;
    case 'check': checkPractice(); break;
    case 'selfmarked': { const it = ITEMS.get(practice.queue[practice.pos]); const r = practice.resp || {}; practice.grade = grade(it, practice.inst, Object.assign({ marks: 0 }, r)); closePracticeItem(it); render(); break; }
    case 'pnext': nextPractice(true); render(); window.scrollTo(0, 0); break;
    case 'again': startPractice(shuffle(practice.queue)); break;
    case 'export': exportHistory(); break;
    case 'clear': modal(t('clearH'), t('confirmClear'), t('del'), () => { ['history', 'wrong', 'seen', 'current'].forEach(k => store.del(k)); render(); }, true); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'lang') { prefs.lang = el.value; store.set('prefs', prefs); render(); }
  else if (act === 'theme') { prefs.theme = el.value; store.set('prefs', prefs); render(); }
  else if (act === 'pcount') { pracCount = +el.value; }
  else if (act === 'punseen') { pracUnseen = el.checked; }
  else if (act === 'import' && el.files && el.files[0]) { importHistory(el.files[0]); el.value = ''; }
  else if (act === 'match') { setResp(el); if (view === 'exam') render(); }
  else if (act === 'cloze' && el.tagName === 'SELECT') { setResp(el); }
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (['cloze', 'num', 'write'].includes(el.dataset.act)) {
    setResp(el);
    if (view === 'exam') {
      const [it, x] = curExamItem();
      const cell = document.querySelector(`.cell[data-q="${exam.pos}"]`);
      if (cell) cell.classList.toggle('ans', !isBlank(it, x.resp));
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (document.querySelector('.modal-back')) return;
  if (e.key === 'Enter' && e.target.closest('[data-act="home"]')) { go('home'); return; }
  if (view === 'exam' && exam) {
    const [it, x] = curExamItem();
    if (e.key === 'ArrowLeft' && exam.pos > 0) { exam.pos--; saveExam(); render(); return; }
    if (e.key === 'ArrowRight' && exam.pos < exam.items.length - 1) { exam.pos++; saveExam(); render(); return; }
    if (e.key.toLowerCase() === 'f') { x.flag = !x.flag; saveExam(); render(); return; }
    const c = keyChoice(e, it, x.inst);
    if (c) { x.resp = applyAction(it, x.inst, x.resp, { dataset: { act: c.act, i: c.i, v: c.v } }); saveExam(); render(); }
  } else if (view === 'practice' && practice && practice.inst) {
    const it = ITEMS.get(practice.queue[practice.pos]);
    if (e.key === 'Enter') { if (!practice.checked) checkPractice(); else if (!(practice.grade && practice.grade.pending)) { nextPractice(true); render(); } return; }
    if (!practice.checked) { const c = keyChoice(e, it, practice.inst); if (c) { practice.resp = applyAction(it, practice.inst, practice.resp, { dataset: { act: c.act, i: c.i, v: c.v } }); render(); } }
  }
});

// ------------------------------------------------------------ start
exam = null;
render();
})();
</script>
