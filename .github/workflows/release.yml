name: Release

# Builds the single-file app and the revision pack from the tagged commit and
# attaches both to the release. dist/ is gitignored, so neither artefact lives in
# the repo — they are produced here, from source, at tag time.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The module has no dependencies (no go.sum), so there is nothing to cache.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # A tag that fails the bank checks must not become a download.
      - name: Verify
        run: |
          go vet ./...
          go test ./...

      - name: Build single-file app
        run: |
          mkdir -p dist
          go run . -export-html dist/mso-ca.html
          ls -lh dist/mso-ca.html

      # The revision pack is built from revision/ with the Python standard library only.
      - name: Build revision pack
        run: |
          python3 revision/pack_build.py dist/mso-revision-pack.html
          ls -lh dist/mso-revision-pack.html

      # The release notes are the tag's message, so an annotated tag says what
      # changed. Branches are merged without pull requests, so GitHub's generated
      # notes would be a bare changelog link; they are only the fallback for a
      # lightweight tag. actions/checkout stores the tag without its message,
      # hence the fetch.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            notes=--notes-from-tag
          else
            notes=--generate-notes
          fi
          gh release create "$GITHUB_REF_NAME" dist/mso-ca.html dist/mso-revision-pack.html \
            --title "$GITHUB_REF_NAME" \
            "$notes"
