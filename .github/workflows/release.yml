name: Release

# Builds the offline study bundle from the tagged commit and publishes it as the
# only release asset; the practice app, notes and originals 01–26 are inside it.
# dist/ is gitignored; release assets are produced from source at tag time.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The module has no dependencies (no go.sum), so there is nothing to cache.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A tag that fails the checks must not become a download. scripts/check.py runs
      # the same checks as CI and leaves dist/mso-study-bundle.zip behind.
      - name: Check and build
        run: python3 scripts/check.py

      # The release notes are the tag's message, so an annotated tag says what
      # changed. Branches are merged without pull requests, so GitHub's generated
      # notes would be a bare changelog link; they are only the fallback for a
      # lightweight tag. actions/checkout stores the tag without its message,
      # hence the fetch.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            notes=--notes-from-tag
          else
            notes=--generate-notes
          fi
          gh release create "$GITHUB_REF_NAME" dist/mso-study-bundle.zip \
            --title "$GITHUB_REF_NAME" \
            "$notes"
