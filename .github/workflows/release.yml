name: Release

# Builds the single-file app and the revision pack from the tagged commit and
# attaches both to the release. dist/ is gitignored, so neither artefact lives in
# the repo — they are produced here, from source, at tag time.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # A tag that fails the bank checks must not become a download.
      - name: Verify
        run: |
          go vet ./...
          go test ./...

      - name: Build single-file app
        run: |
          mkdir -p dist
          go run . -export-html dist/mso-ca.html
          ls -lh dist/mso-ca.html

      # The revision pack is built from revision/ with the Python standard library only.
      - name: Build revision pack
        run: |
          python3 revision/pack_build.py dist/mso-revision-pack.html
          ls -lh dist/mso-revision-pack.html

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/mso-ca.html dist/mso-revision-pack.html \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
