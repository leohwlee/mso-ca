name: CI

# The release workflow only fires on a v* tag, which means a broken bank was
# not caught until the tag had already been pushed. This runs the same checks
# on every push and pull request, so a problem surfaces before release time.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The module has no dependencies (no go.sum), so there is nothing to cache.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Verify coverage and review evidence
        run: |
          python3 docs/build_catalog.py --check
          python3 bank/audit/report.py --check
          python3 bank/audit/terms_report.py --check
          python3 bank/audit/p1_report.py --check
          python3 bank/audit/remaining_report.py --check

      # Building here catches an export that fails even when the bank is sound.
      - name: Build single-file app
        run: |
          mkdir -p dist
          go run . -export-html dist/mso-ca.html
          ls -lh dist/mso-ca.html

      - name: Build revision pack
        run: |
          python3 revision/pack_build.py dist/mso-revision-pack.html
          ls -lh dist/mso-revision-pack.html
