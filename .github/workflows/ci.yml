name: CI

# The release workflow only fires on a v* tag, which means a broken bank was
# not caught until the tag had already been pushed. This runs the same checks
# on every push and pull request, so a problem surfaces before release time.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The module has no dependencies (no go.sum), so there is nothing to cache.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # scripts/check.py is the one list of checks, shared with the release workflow
      # and DEVELOPMENT.md: it exports the app, runs the Go, Node and Python tests and
      # every --check script, then builds and checks the offline bundle, so an export
      # or bundle that fails even when the bank is sound is caught here too.
      - name: Check and build
        run: python3 scripts/check.py
